<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Placement / Campus Recruitment</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#f5f7f9;--ink:#172e2c;--green:#166e58;--muted:#768683;--line:#e5eae8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px 'DM Sans',system-ui}button,input,select{font:inherit}button,a{cursor:pointer}button{border:0}aside{width:230px;position:fixed;inset:0 auto 0 0;background:white;border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column}.logo{font:800 24px Manrope,system-ui;letter-spacing:-1px}.logo b{display:inline-grid;place-items:center;background:var(--green);color:white;width:32px;height:32px;border-radius:10px;margin-right:8px}.micro{font-size:10px;letter-spacing:1.8px;font-weight:700;color:var(--muted)}.navlabel{margin:38px 14px 12px}nav{display:grid;gap:6px}nav button{background:none;text-align:left;padding:13px 14px;border-radius:9px;color:#677975;display:flex;gap:12px;align-items:center}nav button.active{background:#eaf4ee;color:var(--green);font-weight:700}nav button span{width:18px;font-size:17px}.sidebottom{margin-top:auto;padding:16px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}main{margin-left:230px}header{height:82px;padding:0 38px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:white}.crumb{color:var(--muted);font-size:12px}.avatar{display:flex;gap:12px;align-items:center}.avatar b{background:#e7efea;border-radius:50%;padding:12px;color:var(--green)}.content{max-width:1500px;margin:auto;padding:34px 38px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font:800 30px Manrope,system-ui;letter-spacing:-1.2px;margin:5px 0 9px}p{color:var(--muted);line-height:1.6}.btn{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 16px;color:var(--ink)}.primary{background:var(--green);color:white;border-color:var(--green)}.notice{padding:11px 15px;margin:20px 0 24px;border:1px solid #dce8df;background:#eff5ef;border-radius:8px;font-size:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.notice a{color:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px}.stat{padding:22px}.stat .label{display:flex;justify-content:space-between;color:var(--muted)}.stat strong{display:block;font:800 32px Manrope;margin:13px 0 7px}.stat small{color:var(--green)}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;margin-top:24px}.head{padding:21px 23px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h2{font:700 16px Manrope;margin:0}.head small{color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left}th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:#fafcfa;padding:15px 22px}td{padding:17px 22px;border-bottom:1px solid #f0f3f1;font-size:13px}tr:last-child td{border:0}.person{display:flex;align-items:center;gap:11px}.initial{width:32px;height:32px;border-radius:10px;background:#edf3ef;display:grid;place-items:center;color:#387564;font-weight:700}.badge{display:inline-block;padding:5px 9px;font-size:11px;border-radius:5px;background:#e9f4ed;color:#247555}.badge.Rejected,.badge.Failed{background:#fbeeee;color:#b54f4f}.badge.Interview,.badge.Pending{background:#fff4dc;color:#957126}.badge.Applied{background:#eef1fa;color:#637db0}.barrow{margin:21px 23px}.bartext{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}.bar{height:8px;background:#edf2ef;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#428c72;border-radius:6px}.hero{background:#143e35;color:white;padding:28px;border:0;position:relative;overflow:hidden}.hero p{color:#bdd1c7;margin:12px 0 25px;max-width:360px}.hero h2{font-size:22px}.hero:after{content:'↗';font:160px Manrope;position:absolute;right:28px;bottom:-26px;color:#ffffff09;pointer-events:none}.bottomgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.timeline{padding:10px 23px}.timeline article{padding:14px 0;display:flex;gap:14px;border-bottom:1px solid var(--line)}.timeline article:last-child{border:0}.timeline small{display:block;color:var(--muted);margin-top:6px}.toolbar{display:flex;gap:10px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}input,select{background:white;border:1px solid #dbe2de;border-radius:7px;padding:10px 12px;color:var(--ink);max-width:100%}input:focus,select:focus{outline:2px solid #85b5a3;outline-offset:1px}.search{flex:1;min-width:180px}.danger{color:#bd5555;background:none;padding:6px}.edit{color:var(--green);background:none;padding:6px}.empty{text-align:center;padding:45px;color:var(--muted)}footer{color:var(--muted);font-size:11px;margin-top:28px;display:flex;justify-content:space-between}dialog{border:1px solid var(--line);border-radius:14px;width:500px;max-width:92vw;padding:26px;box-shadow:0 25px 80px #12352c30}dialog::backdrop{background:#112a2766}form{display:grid;gap:17px}label{display:grid;gap:7px;font-size:12px;font-weight:600}.actions{display:flex;justify-content:flex-end;gap:10px}.formerror{color:#b63c3c;font-size:12px}.toast{position:fixed;bottom:24px;right:24px;background:#183d33;color:white;padding:15px 22px;border-radius:10px;z-index:5;box-shadow:0 5px 30px #0002}.sql{white-space:pre-wrap;background:#173a32;color:#d1e6d8;padding:22px;border-radius:8px;font:12px/1.8 monospace}.mobilemenu{display:none}a.btn{text-decoration:none}.help{padding:23px}.help li{margin:12px 0;color:#5c736d;line-height:1.5}

</style></head><body><aside id="sidebar"><div class="logo"><b>p</b>placement<span style="color:#84a694">.</span></div><div class="micro" style="margin:10px 0 0 43px">CAMPUS RECRUITMENT</div><div class="micro navlabel">WORKSPACE</div><nav id="nav"></nav><div class="sidebottom"><b style="color:#23473c">DBMS Course Project</b><p>Placement & recruitment<br>Academic year 2026–27</p><button class="btn" onclick="go('Project guide')">Project guide ↗</button></div></aside><main><header><div style="display:flex;gap:15px;align-items:center"><button class="btn mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="crumb">Workspace &nbsp; / &nbsp; <b id="crumb">Overview</b></div></div><div class="avatar"><span style="color:#789187;font-size:12px">● &nbsp; Placement cell</span><b>PC</b><div class="identity"><strong>Coordinator</strong><div style="font-size:11px;color:#768683;margin-top:4px">Academic workspace</div></div></div></header><div class="content"><div id="page"></div><footer><span>Campus Placement & Recruitment Drive Management System</span><span>Built for better beginnings ↗</span></footer></div></main><dialog id="modal"></dialog><div id="toast" hidden></div><script>
const CONFIG={"Department": {"pk": "dept_id", "fields": {"dept_name": "text", "hod_name": "text"}}, "Student": {"pk": "student_id", "fields": {"name": "text", "dept_id": "Department", "cgpa": "number", "email": "email"}}, "Company": {"pk": "company_id", "fields": {"name": "text", "sector": "text", "hr_contact": "email"}}, "Drive": {"pk": "drive_id", "fields": {"company_id": "Company", "role": "text", "ctc": "number", "drive_date": "date", "min_cgpa": "number"}}, "Application": {"pk": "application_id", "fields": {"student_id": "Student", "drive_id": "Drive", "status": ["Applied", "Interview", "Selected", "Rejected"]}}, "Interview": {"pk": "interview_id", "fields": {"application_id": "Application", "round_no": "number", "result": ["Pending", "Passed", "Failed"]}}, "Placement": {"pk": "placement_id", "fields": {"application_id": "Application", "package": "number", "placement_date": "date"}}},SEED={"Department": [{"dept_id": 1, "dept_name": "CSE", "hod_name": "Department Coordinator"}, {"dept_id": 2, "dept_name": "ECE", "hod_name": "Department Coordinator"}, {"dept_id": 3, "dept_name": "IT", "hod_name": "Department Coordinator"}, {"dept_id": 4, "dept_name": "ME", "hod_name": "Department Coordinator"}], "Student": [{"student_id": 1, "name": "Aarav Mehta", "dept_id": 1, "cgpa": 8.9, "email": "aarav@example.edu"}, {"student_id": 2, "name": "Sara Iyer", "dept_id": 2, "cgpa": 8.2, "email": "sara@example.edu"}, {"student_id": 3, "name": "Rohan Das", "dept_id": 1, "cgpa": 7.8, "email": "rohan@example.edu"}, {"student_id": 4, "name": "Priya Nair", "dept_id": 3, "cgpa": 9.1, "email": "priya@example.edu"}, {"student_id": 5, "name": "Kunal Shah", "dept_id": 4, "cgpa": 7.4, "email": "kunal@example.edu"}], "Company": [{"company_id": 1, "name": "TCS", "sector": "Technology", "hr_contact": "tcs@example.com"}, {"company_id": 2, "name": "Infosys", "sector": "Technology", "hr_contact": "infosys@example.com"}, {"company_id": 3, "name": "Wipro", "sector": "Technology", "hr_contact": "wipro@example.com"}, {"company_id": 4, "name": "Accenture", "sector": "Technology", "hr_contact": "accenture@example.com"}, {"company_id": 5, "name": "Cognizant", "sector": "Technology", "hr_contact": "cognizant@example.com"}], "Drive": [{"drive_id": 101, "company_id": 1, "role": "Analyst", "ctc": 6.5, "drive_date": "2026-08-11", "min_cgpa": 7}, {"drive_id": 102, "company_id": 2, "role": "SDE", "ctc": 7.2, "drive_date": "2026-08-12", "min_cgpa": 7}, {"drive_id": 103, "company_id": 3, "role": "SDE", "ctc": 6, "drive_date": "2026-08-13", "min_cgpa": 7}, {"drive_id": 104, "company_id": 4, "role": "Consultant", "ctc": 8, "drive_date": "2026-08-14", "min_cgpa": 7}, {"drive_id": 105, "company_id": 5, "role": "SDE", "ctc": 6.8, "drive_date": "2026-08-15", "min_cgpa": 7}], "Application": [{"application_id": 1, "student_id": 1, "drive_id": 101, "status": "Selected"}, {"application_id": 2, "student_id": 2, "drive_id": 102, "status": "Interview"}, {"application_id": 3, "student_id": 3, "drive_id": 103, "status": "Rejected"}, {"application_id": 4, "student_id": 4, "drive_id": 104, "status": "Selected"}, {"application_id": 5, "student_id": 5, "drive_id": 105, "status": "Applied"}], "Interview": [{"interview_id": 1, "application_id": 2, "round_no": 1, "result": "Pending"}], "Placement": [{"placement_id": 1, "application_id": 1, "package": 6.5, "placement_date": "2026-08-11"}, {"placement_id": 2, "application_id": 4, "package": 8, "placement_date": "2026-08-14"}]};
const names={'Overview':'◫','Student':'♙','Company':'▦','Drive':'↗','Application':'▤','Interview':'◷','Placement':'♧','Department':'⌘','Reports':'▥','Project guide':'?'};
const plurals={Student:'Students',Company:'Companies',Drive:'Recruitment drives',Application:'Applications',Interview:'Interviews',Placement:'Placements',Department:'Departments'};
let state=JSON.parse(localStorage.getItem('placement-v1')||'null')||structuredClone(SEED),tab='Overview',query='',api=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n).toFixed(1)+' LPA';
const label=k=>k.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
function ref(t,id){const r=state[t].find(x=>x[CONFIG[t].pk]==id);if(!r)return 'Missing record';return r.name||r.dept_name||(t==='Drive'?ref('Company',r.company_id)+' · '+r.role:t==='Application'?ref('Student',r.student_id)+' → '+ref('Drive',r.drive_id):'#'+id)}
function value(k,v){if(k.endsWith('_id')){const t=Object.keys(CONFIG).find(t=>CONFIG[t].pk===k);return t?esc(ref(t,v)):esc(v)}if(k==='ctc'||k==='package')return money(v);if(k==='status'||k==='result')return '<span class="badge '+esc(v)+'">'+esc(v)+'</span>';return esc(v)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;setTimeout(()=>t.hidden=true,3500)}
async function load(){try{const r=await fetch('/api/state');if(r.ok){state=await r.json();api=true}}catch{}render()};
function go(t){tab=t;query='';document.getElementById('sidebar').classList.remove('open');render()}
function placed(){return new Set(state.Placement.map(p=>state.Application.find(a=>a.application_id===p.application_id)?.student_id)).size}
function summary(){return state.Department.map(d=>{const ps=state.Placement.filter(p=>{const a=state.Application.find(a=>a.application_id===p.application_id);return state.Student.find(s=>s.student_id===a?.student_id)?.dept_id===d.dept_id});return {...d,count:ps.length,top:ps.length?Math.max(...ps.map(p=>+p.package)):0}}).sort((a,b)=>b.count-a.count)}
function notice(){return '<div class="notice"><span>● &nbsp; '+(api?'MySQL connected · Changes are saved to your database.':'Interactive preview · Sample records are saved in this browser. Use the downloaded app for the required MySQL demo.')+'</span><a href="/download">Download MySQL project ↓</a></div>'}
function table(t,rows,actions=true){const cols=[CONFIG[t].pk,...Object.keys(CONFIG[t].fields)];return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+label(c)+'</th>').join('')+(actions?'<th>Actions</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+value(c,r[c])+'</td>').join('')+(actions?'<td><button class="edit" onclick="openForm(\''+t+'\','+r[CONFIG[t].pk]+')">Edit</button><button class="danger" onclick="askDelete(\''+t+'\','+r[CONFIG[t].pk]+')">Delete</button></td>':'')+'</tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">No records found. Add a record to get started.</div>')+'</div>'}
function render(){document.getElementById('nav').innerHTML=Object.keys(names).map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="go(\''+t+'\')"><span>'+names[t]+'</span>'+(plurals[t]||t)+'</button>').join('');document.getElementById('crumb').textContent=plurals[tab]||tab;const page=document.getElementById('page');if(tab==='Overview'){const rate=state.Student.length?Math.round(placed()/state.Student.length*100):0;page.innerHTML='<div class="top"><div><div class="micro">YOUR PLACEMENT WORKSPACE</div><h1>A world of opportunity.</h1><p style="margin:0">Manage every step from first application to final offer.</p></div><button class="btn primary" onclick="openForm(\'Drive\')">＋ Create drive</button></div>'+notice()+'<div class="stats">'+[['Registered students',state.Student.length,'Across '+state.Department.length+' departments','♙'],['Recruitment drives',state.Drive.length,'With '+state.Company.length+' company partners','↗'],['Students placed',placed(),rate+'% placement rate','♧'],['Highest package',state.Placement.length?money(Math.max(...state.Placement.map(x=>+x.package))):'—','Annual compensation','₹']].map(x=>'<div class="card stat"><div class="label">'+x[0]+'<span>'+x[3]+'</span></div><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div>').join('')+'</div><div class="grid"><section class="card"><div class="head"><h2>Recruitment drives</h2><button class="edit" onclick="go(\'Drive\')">View all ↗</button></div>'+table('Drive',state.Drive.slice(0,5),false)+'</section><section class="card"><div class="head"><h2>Department performance</h2><small>Placements</small></div>'+summary().map(x=>'<div class="barrow"><div class="bartext"><b>'+esc(x.dept_name)+'</b><span>'+x.count+' placed · '+(x.top?money(x.top):'—')+'</span></div><div class="bar"><i style="width:'+Math.min(100,x.count/Math.max(1,placed())*100)+'%"></i></div></div>').join('')+'<div style="padding:6px 23px 20px;color:#87948c;font-size:11px">All departments included, even with zero placements.</div></section></div><div class="bottomgrid"><section class="card hero"><div class="micro" style="color:#91b5a3">THE NEXT BIG STEP</div><h2 style="margin-top:15px">Connect talent. Create futures.</h2><p>A single place for students, recruiters, interviews and the offers that change everything.</p><button class="btn" onclick="openForm(\'Student\')">Register a student &nbsp; ↗</button></section><section class="card"><div class="head"><h2>Application pipeline</h2><button class="edit" onclick="go(\'Application\')">Manage ↗</button></div><div class="timeline">'+['Applied','Interview','Selected','Rejected'].map(s=>'<article><span class="badge '+s+'">'+s+'</span><div style="flex:1">'+state.Application.filter(a=>a.status===s).length+' applications<small>'+({Applied:'Ready for the next step',Interview:'Meeting their future team',Selected:'An offer on the horizon',Rejected:'The search continues'}[s])+'</small></div></article>').join('')+'</div></section></div>'}else if(CONFIG[tab]){page.innerHTML='<div class="top"><div><div class="micro">RECRUITMENT MANAGEMENT</div><h1>'+plurals[tab]+'</h1><p style="margin:0">View, insert and manage '+plurals[tab].toLowerCase()+' in one place.</p></div><button class="btn primary" onclick="openForm(\''+tab+'\')">＋ Add '+tab.toLowerCase()+'</button></div>'+notice()+'<div class="card"><div class="toolbar"><input class="search" aria-label="Search records" placeholder="Search '+plurals[tab].toLowerCase()+'…" oninput="query=this.value;renderRows()"><span style="color:#768683">'+state[tab].length+' records</span><button class="btn" onclick="csv()">Export CSV ↓</button></div><div id="records"></div></div>';renderRows()}else if(tab==='Reports'){page.innerHTML='<div class="top"><div><div class="micro">PLACEMENT ANALYTICS</div><h1>Every outcome, in focus.</h1><p>Department-wise placement counts and highest packages.</p></div><button class="btn" onclick="reportCSV()">Export report ↓</button></div>'+notice()+'<div class="card"><div class="head"><h2>Department-wise placement report</h2><small>Live records</small></div><table><thead><tr><th>Department</th><th>Placement offers</th><th>Highest package</th></tr></thead><tbody>'+summary().map(d=>'<tr><td>'+esc(d.dept_name)+'</td><td>'+d.count+'</td><td>'+(d.top?money(d.top):'—')+'</td></tr>').join('')+'</tbody></table></div><h2 style="margin:28px 0 15px">SQL behind this report</h2><pre class="sql">SELECT d.dept_name, COUNT(p.placement_id) AS placed_count,\n       MAX(p.package) AS top_package\nFROM Department d\nLEFT JOIN Student s ON s.dept_id = d.dept_id\nLEFT JOIN Application a ON a.student_id = s.student_id\nLEFT JOIN Placement p ON p.application_id = a.application_id\nGROUP BY d.dept_id, d.dept_name\nORDER BY placed_count DESC;</pre><p>The PDF’s sample data produces CSE: 1, IT: 1, ECE: 0, ME: 0. Its illustrated CSE count of 3 does not match those records.</p>'}else{page.innerHTML='<div class="micro">PRESENTATION III</div><h1>Your demo, ready to explain.</h1>'+notice()+'<div class="card help"><h2>Run the MySQL version</h2><ol><li>Download and extract the project. Install Python and MySQL 8.0.16 or newer.</li><li>Run <code>Presentation-II/schema.sql</code> and <code>seed.sql</code> in MySQL Workbench.</li><li>Open a terminal in the project, run <code>pip install -r requirements.txt</code>, copy <code>.env.example</code> to <code>.env</code> and set your MySQL password.</li><li>Run <code>python app.py</code>. Open <code>http://127.0.0.1:5000</code>. The connection banner must say MySQL connected.</li><li>Add a student, view the new row in the UI and MySQL, then delete that student and show both again.</li></ol><a class="btn primary" href="/download">Download complete project ↓</a></div><div class="bottomgrid"><div class="card help"><h2>Database rules</h2><p>Seven related tables, foreign keys, unique student email, unique applications, one placement per application, CGPA checks, and selected-only placements.</p><p>Deletion of a referenced parent is blocked to protect dependent records.</p></div><div class="card help"><h2>Submission checklist</h2><p>Four repository folders are included. Add your original slides, real screenshots, report PDF, name and roll number.</p><p>GitHub repository: <b>DBMS-Course-Project</b><br>Report deadline: <b>10 October 2026</b>.</p></div></div>'}}
function renderRows(){document.getElementById('records').innerHTML=table(tab,state[tab].filter(r=>Object.entries(r).some(([k,v])=>String(v).toLowerCase().includes(query.toLowerCase())||String(value(k,v)).toLowerCase().includes(query.toLowerCase()))))}
function openForm(t,id){const old=id?state[t].find(r=>r[CONFIG[t].pk]===id):null;const modal=document.getElementById('modal');modal.innerHTML='<form id="recordform"><div class="top"><h2>'+(old?'Edit':'Add')+' '+t.toLowerCase()+'</h2><button type="button" class="edit" onclick="modal.close()">✕</button></div>'+Object.entries(CONFIG[t].fields).map(([k,type])=>{let input;if(Array.isArray(type)){input='<select name="'+k+'">'+type.map(v=>'<option '+(old?.[k]===v?'selected':'')+'>'+v+'</option>').join('')+'</select>'}else if(CONFIG[type]){input='<select required name="'+k+'"><option value="">Select '+type.toLowerCase()+'</option>'+state[type].map(r=>'<option value="'+r[CONFIG[type].pk]+'" '+(old?.[k]===r[CONFIG[type].pk]?'selected':'')+'>'+esc(ref(type,r[CONFIG[type].pk]))+'</option>').join('')+'</select>'}else{let attrs=type==='number'?'step="0.01" min="'+(k==='round_no'?'1':'0')+'" '+(['cgpa','min_cgpa'].includes(k)?'max="10"':k==='round_no'?'step="1"':''):'';input='<input required maxlength="150" name="'+k+'" type="'+type+'" '+attrs+' value="'+esc(old?.[k]??(k==='min_cgpa'?7:''))+'">'}return '<label>'+label(k)+(k==='ctc'||k==='package'?' (LPA)':'')+input+'</label>'}).join('')+'<div class="formerror" id="error" role="alert"></div><div class="actions"><button type="button" class="btn" onclick="modal.close()">Cancel</button><button class="btn primary">Save record</button></div></form>';modal.showModal();document.getElementById('recordform').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));Object.entries(CONFIG[t].fields).forEach(([k,type])=>{if(type==='number'||CONFIG[type])data[k]=Number(data[k]);else data[k]=data[k].trim()});try{if(api){const res=await fetch('/api/'+t+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await res.json();if(!res.ok)throw Error(body.error);await load()}else{validate(t,data,id);if(id)Object.assign(old,data);else state[t].push({...data,[CONFIG[t].pk]:Math.max(0,...state[t].map(r=>r[CONFIG[t].pk]))+1});persist();render()}modal.close();toast('Record saved successfully')}catch(e){document.getElementById('error').textContent=e.message}}}
function validate(t,d,id){if(t==='Student'&&state.Student.some(r=>r.email===d.email&&r.student_id!==id))throw Error('Student email must be unique.');if(t==='Department'&&state.Department.some(r=>r.dept_name===d.dept_name&&r.dept_id!==id))throw Error('Department already exists.');if(t==='Application'){if(state.Application.some(r=>r.student_id===d.student_id&&r.drive_id===d.drive_id&&r.application_id!==id))throw Error('This student already applied to this drive.');const s=state.Student.find(s=>s.student_id===d.student_id),v=state.Drive.find(v=>v.drive_id===d.drive_id);if(!s||!v||+s.cgpa<+v.min_cgpa)throw Error('Student does not meet the drive CGPA requirement.');if(d.status!=='Selected'&&state.Placement.some(p=>p.application_id===id))throw Error('Remove the placement before changing selected status.')}if(t==='Placement'){if(state.Application.find(a=>a.application_id===d.application_id)?.status!=='Selected')throw Error('Only a Selected application can receive a placement.');if(state.Placement.some(p=>p.application_id===d.application_id&&p.placement_id!==id))throw Error('This application already has a placement.')}if(t==='Interview'&&state.Interview.some(r=>r.application_id===d.application_id&&r.round_no===d.round_no&&r.interview_id!==id))throw Error('This interview round already exists.')}
function persist(){localStorage.setItem('placement-v1',JSON.stringify(state))}
function askDelete(t,id){const m=document.getElementById('modal');m.innerHTML='<h2>Delete this '+t.toLowerCase()+'?</h2><p>Record #'+id+' will be removed. Records referenced by other tables cannot be deleted.</p><div class="actions"><button class="btn" onclick="modal.close()">Cancel</button><button class="btn primary" id="confirmdelete">Delete record</button></div><p class="formerror" id="error"></p>';m.showModal();document.getElementById('confirmdelete').onclick=async()=>{try{if(api){const res=await fetch('/api/'+t+'/'+id,{method:'DELETE'});if(!res.ok)throw Error((await res.json()).error);await load()}else{const pk=CONFIG[t].pk;for(const child of Object.keys(CONFIG))if(child!==t&&Object.keys(CONFIG[child].fields).includes(pk)&&state[child].some(r=>r[pk]===id))throw Error('Referenced by '+child+'. Delete dependent records first.');state[t]=state[t].filter(r=>r[pk]!==id);persist();render()}m.close();toast('Record deleted')}catch(e){document.getElementById('error').textContent=e.message}}}
function downloadCSV(rows,file){const keys=Object.keys(rows[0]||{}),cell=x=>'"'+String(x??'').replaceAll('"','""').replace(/^[=+@-]/,"'$&")+'"';const b=new Blob([keys.map(cell).join(',')+'\n'+rows.map(r=>keys.map(k=>cell(r[k])).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file;a.click();URL.revokeObjectURL(a.href)}function csv(){downloadCSV(state[tab],tab+'.csv')}function reportCSV(){downloadCSV(summary().map(d=>({department:d.dept_name,placements:d.count,highest_package_lpa:d.top})),'placement-report.csv')}
load();
</script></body></html>
